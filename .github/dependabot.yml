version: 2

updates:
  # Dart / Flutter 依赖：pubspec.lock 已锁定，升级以 PR 形式提出，由 CI 验证。
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      dart-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 工作流里用到的 action 版本。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
