name: xingji
description: Private, offline-first encrypted memo for Windows and Android.
publish_to: none
version: 0.5.1+9

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sodium: 4.1.2
  sqlite3: 3.8.0
  postgres: 3.5.20
  ffi: ^2.1.4
  uuid: ^4.5.2
  path: ^1.9.1
  timezone: ^0.11.2
  file_selector: ^1.0.4
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
